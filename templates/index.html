<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
    <!-- SEO 元标签 -->
    <title>HTML to Markdown 在线转换器 - 免费、快速、开源</title>
    <meta name="description" content="免费在线 HTML 转 Markdown 工具，支持实时转换、URL 抓取、拖拽上传。开源项目，无广告，保护隐私。">
    <meta name="keywords" content="HTML转Markdown,HTML to Markdown,在线转换,免费工具,开源,实时转换">
    <meta name="author" content="HTML to Markdown Converter">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / 社交媒体分享 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://html-to-md-qfrj.onrender.com">
    <meta property="og:title" content="HTML to Markdown 在线转换器">
    <meta property="og:description" content="免费在线 HTML 转 Markdown 工具，支持实时转换、URL 抓取、拖拽上传。">
    <meta property="og:image" content="https://raw.githubusercontent.com/SEYYl/html-to-markdown-web/main/screenshots/preview.png">
    <meta property="og:locale" content="zh_CN">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://html-to-md-qfrj.onrender.com">
    <meta name="twitter:title" content="HTML to Markdown 在线转换器">
    <meta name="twitter:description" content="免费在线 HTML 转 Markdown 工具，支持实时转换、URL 抓取、拖拽上传。">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/SEYYl/html-to-markdown-web/main/screenshots/preview.png">
    
    <!-- 其他元标签 -->
    <meta name="theme-color" content="#3b82f6">
    <link rel="canonical" href="https://html-to-md-qfrj.onrender.com">
    
    <!-- 外部资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
    <script>
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: false,
        });
    </script>
</head>
<body>
<div class="container">
    <h1>📝 HTML → Markdown 转换器</h1>
    <div class="sub">粘贴 HTML、拖拽文件或选择示例，实时转换</div>

    <div class="toolbar">
        <div class="toolbar-left example-group">
            <button class="example-btn" data-example="simple">📄 简单示例</button>
            <button class="example-btn" data-example="table">📊 表格示例</button>
            <button class="example-btn" data-example="code">💻 代码块示例</button>
        </div>
        <div class="toolbar-actions">
            <button id="clearBtn" class="theme-btn">🧹 清空</button>
            <button id="urlConvertBtn" class="theme-btn">🌐 URL 转换</button>
            <button id="layoutToggleBtn" class="theme-btn">当前布局：堆叠</button>
            <button id="themeToggle" class="theme-btn"> 深色模式</button>
        </div>
    </div>

    <div class="modal" id="urlModal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
            <div class="modal-header">
                <span> URL 转换</span>
                <button id="urlModalClose" class="icon-btn">✕</button>
            </div>
            <div class="modal-body">
                <label for="urlInput">请输入网页地址（http:// 或 https://）</label>
                <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off">
                <p class="modal-help">支持直接抓取网页并转换为 Markdown，可用于在线文章、文档或博客页面。</p>
            </div>
            <div class="modal-footer">
                <button id="urlModalCancel" class="theme-btn secondary">取消</button>
                <button id="urlModalSubmit" class="theme-btn">开始转换</button>
            </div>
        </div>
    </div>

    <div class="converter-box">
        <div class="panel" id="inputPanel">
            <div class="panel-header">
                <div class="panel-title">📄 HTML 输入</div>
                <div class="panel-actions">
                    <button id="pasteBtn" class="copy-btn">📋 粘贴</button>
                    <span class="panel-note">💡 支持拖拽 .html 文件</span>
                </div>
            </div>
            <textarea id="htmlInput" rows="15" placeholder="在此粘贴 HTML 代码，或拖拽 HTML 文件到此处..."></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">📝 Markdown 输出</div>
                <div class="panel-actions">
                    <button id="downloadBtn" class="copy-btn">️ 下载</button>
                    <button id="copyBtn" class="copy-btn">📋 复制</button>
                </div>
            </div>
            <div id="markdownOutput" class="markdown-output">
                <div class="loading-overlay" id="loadingOutput" aria-hidden="true">
                    <div class="loading-spinner"></div>
                    <span>转换中...</span>
                </div>
            </div>
        </div>
        <div class="panel preview-panel">
            <div class="panel-header">
                <div class="panel-title">🔍 Markdown 预览</div>
                <div class="panel-actions">
                    <button id="previewToggleBtn" class="copy-btn">🔎 放大预览</button>
                </div>
            </div>
            <div id="markdownPreview" class="markdown-output preview-output">
                <div class="loading-overlay" id="loadingPreview" aria-hidden="true">
                    <div class="loading-spinner"></div>
                    <span>转换中...</span>
                </div>
            </div>
        </div>
    </div>
    <footer>
        ⚡ 开源项目 · <a href="https://github.com/SEYYl/html-to-markdown-web" target="_blank">GitHub 仓库</a>
    </footer>

    <div class="toast" id="toastContainer" aria-live="polite"></div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
